<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="page">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Green Law">
      <div class="brand-text">
        <div class="brand-name">Green Law</div>
        <div class="brand-sub">اختاري القسم اللي تحبي</div>
      </div>
    </div>

    <a class="btn btn-ghost" href="/login">رجوع لتسجيل الدخول</a>
  </header>

  <!-- Sections -->
  <main class="container">
    <h1 class="page-title">الأقسام</h1>

    <div class="cards">
      <!-- Plant -->
      <section class="card card-bg card-plant">
        <div class="card-overlay"></div>
        <div class="card-content">
          <h2>🌿 قسم نباتي</h2>
          <p>أمراض النباتات • أسمدة • تقنيات حديثة</p>
          <a class="btn" href="#">ادخل</a>
        </div>
      </section>

      <!-- Animal -->
      <section class="card card-bg card-animal">
        <div class="card-overlay"></div>
        <div class="card-content">
          <h2>🐄 قسم حيواني</h2>
          <p>تربية المواشي • نصائح • توجيهات</p>
          <a class="btn" href="#">ادخل</a>
        </div>
      </section>
    </div>
  </main>

</body>
</html>

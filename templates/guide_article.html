<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="page guide-page guide-{{ section }}-bg">

  <header class="navbar guide-navbar">
    <div class="container">
      <div class="brand">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Green Law">
        <div>
          <div class="title">{{ app_name }}</div>
          <div class="subtitle">{{ page_title }}</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <details class="lang-dd">
          <summary>🌐</summary>
          <div class="lang-menu">
            <a href="{{ url_for('set_lang', lang_code='ar') }}">{{ t('ui.lang.arabic', default='العربية') }}</a>
            <a href="{{ url_for('set_lang', lang_code='fr') }}">{{ t('ui.lang.french', default='Français') }}</a>
            <a href="{{ url_for('set_lang', lang_code='en') }}">{{ t('ui.lang.english', default='English') }}</a>
          </div>
        </details>

        <a class="btn btn-outline" href="{{ back_url }}">{{ t("ui.back", default="رجوع") }}</a>
      </div>
    </div>
  </header>

  <div class="guide-overlay"></div>

  <main class="container guide-content">
    <h1 class="guide-title">{{ article_title }}</h1>

    <div class="article-card card">
      <div class="article-actions">
        <button class="btn btn-primary" type="button" onclick="playGTTS()">
          🔊 {{ t("guide.listen", default="استمع") }}
        </button>

        <button class="btn" type="button" onclick="stopGTTS()">
          ⏹️ {{ t("guide.stop", default="إيقاف") }}
        </button>
      </div>

      <div id="articleText" class="article-body">{{ article_body }}</div>

      <audio id="audioPlayer" controls style="width:100%; margin-top:12px; display:none;"></audio>
    </div>
  </main>

  <script>
    let currentUrl = null;

    async function playGTTS(){
      try{
        stopGTTS();
        const text = document.getElementById("articleText").innerText.trim();
        if(!text) return;

        const fd = new FormData();
        fd.append("text", text);

        const res = await fetch("{{ url_for('tts_api') }}", { method:"POST", body: fd });
        if(!res.ok) throw new Error("tts failed");

        const blob = await res.blob();
        currentUrl = URL.createObjectURL(blob);

        const audio = document.getElementById("audioPlayer");
        audio.style.display = "block";
        audio.src = currentUrl;
        await audio.play();
      }catch(e){
        alert("فشل تشغيل الصوت. تأكدي من الإنترنت.");
      }
    }

    function stopGTTS(){
      const audio = document.getElementById("audioPlayer");
      if(audio){
        audio.pause();
        audio.currentTime = 0;
      }
      if(currentUrl){
        URL.revokeObjectURL(currentUrl);
        currentUrl = null;
      }
    }
  </script>

</body>
</html>
